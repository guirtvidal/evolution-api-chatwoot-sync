services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: starttrust/evolution-api-chatwoot-sync:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    env_file:
      - path: .env.docker.example
        required: true
      - path: .env
        required: false
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-evolution}
      POSTGRES_USER: ${POSTGRES_USERNAME:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - evolution

volumes:
  evolution_instances:
  postgres_data:
  redis_data:

networks:
  evolution:
    driver: bridge
